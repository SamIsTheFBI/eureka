apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-db
                  key: DATABASE_URL
            - name: MASTER_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: gateway-master-key
                  key: MASTER_KEY_HEX
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-session-key
                  key: SESSION_KEY
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gateway-bootstrap-admin
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-bootstrap-admin
                  key: ADMIN_PASSWORD
            - name: WOO_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: woo-mcp-token
                  key: MCP_TOKEN
            - name: LLM_PROVIDER
              value: {{ .Values.gateway.llm.provider | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.gateway.llm.baseURL | quote }}
            - name: LLM_MODEL
              value: {{ .Values.gateway.llm.model | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: API_KEY
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
