apiVersion: v1
kind: Secret
metadata:
  name: gateway-db
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
  DATABASE_URL: "postgres://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@postgres:5432/{{ .Values.secrets.postgresDatabase }}?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-master-key
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  MASTER_KEY_HEX: {{ .Values.secrets.masterKeyHex | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-session-key
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_KEY: {{ .Values.secrets.sessionKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-bootstrap-admin
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-token
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  MCP_TOKEN: {{ .Values.secrets.wooMcpToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: utils-mcp-secret
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_KEY: {{ .Values.secrets.utilsAuthKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-key
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ .Values.secrets.llmApiKey | quote }}
