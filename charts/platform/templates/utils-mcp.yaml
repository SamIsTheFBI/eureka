apiVersion: v1
kind: Service
metadata:
  name: utils-mcp
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: utils-mcp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: utils-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utils-mcp
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: utils-mcp
spec:
  replicas: {{ .Values.utilsMcp.replicas }}
  selector:
    matchLabels:
      app: utils-mcp
  template:
    metadata:
      labels:
        app: utils-mcp
    spec:
      containers:
        - name: utils-mcp
          image: {{ .Values.utilsMcp.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_HEADER
              value: "X-Utils-Key"
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: utils-mcp-secret
                  key: AUTH_KEY
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.utilsMcp.resources | nindent 12 }}
