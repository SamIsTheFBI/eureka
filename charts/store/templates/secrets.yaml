apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}
  MYSQL_USER: {{ .Values.secrets.mysqlUser | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  MYSQL_DATABASE: {{ .Values.secrets.mysqlDatabase | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wp-admin
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  WP_ADMIN_USER: {{ .Values.secrets.wpAdminUser | quote }}
  WP_ADMIN_PASSWORD: {{ .Values.secrets.wpAdminPassword | quote }}
  WP_ADMIN_EMAIL: {{ .Values.secrets.wpAdminEmail | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-rest-keys
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  WOO_CONSUMER_KEY: {{ .Values.secrets.wooConsumerKey | quote }}
  WOO_CONSUMER_SECRET: {{ .Values.secrets.wooConsumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-token
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
  MCP_TOKEN: {{ .Values.secrets.mcpBearerToken | quote }}
