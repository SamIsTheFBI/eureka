apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: woo-mcp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: woo-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app: woo-mcp
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      containers:
        - name: woo-mcp
          image: {{ .Values.wooMcp.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: WOO_BASE_URL
              value: "http://wordpress:8080"
            - name: WOO_HOST_HEADER
              value: {{ .Values.ingress.host | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-rest-keys
                  key: WOO_CONSUMER_KEY
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-rest-keys
                  key: WOO_CONSUMER_SECRET
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: woo-mcp-token
                  key: MCP_TOKEN
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
