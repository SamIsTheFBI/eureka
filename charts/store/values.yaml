ingress:
  enabled: true
  ingressClassName: traefik
  host: store.localtest.me
  tls: false

mysql:
  image: mysql:8.0
  storage: 5Gi
  storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

wordpress:
  image: urumi/wordpress-custom:latest
  storage: 2Gi
  storageClassName: local-path
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

wooMcp:
  image: urumi/woo-mcp:latest
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

secrets:
  mysqlRootPassword: "RootPassword987!"
  mysqlUser: "wordpress"
  mysqlPassword: "StorePassword123!"
  mysqlDatabase: "wordpress"
  wpAdminUser: "admin"
  wpAdminPassword: "AdminStorePass123!"
  wpAdminEmail: "admin@store.localtest.me"
  wooConsumerKey: "ck_urumi_store_key_12345"
  wooConsumerSecret: "cs_urumi_store_secret_67890"
  mcpBearerToken: "woo-mcp-shared-bearer-token-12345"
